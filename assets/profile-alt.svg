  <path d="M82 100 C86 130, 92 145, 86 160 C80 145, 80 120, 82 100 Z" fill="#292524"/>
  <path d="M174 100 C170 130, 164 145, 170 160 C176 145, 176 120, 174 100 Z" fill="#292524"/>

