<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5"/>
      <stop offset="100%" stop-color="#e8b998"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2226"/>
      <stop offset="100%" stop-color="#171214"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bg)" rx="16"/>
  <circle cx="128" cy="128" r="90" fill="#27272a" opacity="0.3"/>

  <!-- Body / Hoodie -->
  <path d="M50 256 C50 200, 75 180, 128 180 C181 180, 206 200, 206 256 Z" fill="url(#hoodie)"/>
  <path d="M106 182 L128 214 L150 182 Z" fill="#3f3f46" opacity="0.6"/>

  <!-- Neck -->
  <path d="M114 165 L114 186 C114 192, 142 192, 142 186 L142 165 Z" fill="#d9a784"/>

  <!-- Head / Face -->
  <ellipse cx="128" cy="132" rx="46" ry="52" fill="url(#skin)"/>

  <!-- Hair Back -->
  <path d="M72 135 C64 90, 85 52, 128 52 C171 52, 192 90, 184 135 C178 175, 172 205, 168 220 L88 220 C84 205, 78 175, 72 135 Z" fill="url(#hair)"/>

  <!-- Ears -->
  <circle cx="82" cy="134" r="8" fill="#e8b998"/>
  <circle cx="174" cy="134" r="8" fill="#e8b998"/>

  <!-- Face details -->
  <!-- Eyebrows -->
  <path d="M96 116 Q108 112 118 116" stroke="#2a2226" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M138 116 Q148 112 160 116" stroke="#2a2226" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="108" cy="127" rx="5.5" ry="6.5" fill="#1e1b18"/>
  <ellipse cx="148" cy="127" rx="5.5" ry="6.5" fill="#1e1b18"/>
  <circle cx="106" cy="125" r="2" fill="#ffffff"/>
  <circle cx="146" cy="125" r="2" fill="#ffffff"/>

  <!-- Cute Eyelashes -->
  <path d="M102 122 Q108 120 114 122" stroke="#18181b" stroke-width="2" fill="none"/>
  <path d="M142 122 Q148 120 154 122" stroke="#18181b" stroke-width="2" fill="none"/>

  <!-- Nose -->
  <path d="M127 132 Q128 140 124 142" stroke="#d49774" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Friendly Smile -->
  <path d="M120 152 Q128 159 136 152" stroke="#b95d5d" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Hair Bangs / Front -->
  <path d="M78 115 C82 72, 102 60, 128 60 C154 60, 174 72, 178 115 C165 92, 145 90, 128 92 C111 90, 91 92, 78 115 Z" fill="url(#hair)"/>
  <path d="M92 88 C96 110, 100 118, 96 128 C92 118, 90 102, 92 88 Z" fill="#201a1c"/>
  <path d="M164 88 C160 110, 156 118, 160 128 C164 118, 166 102, 164 88 Z" fill="#201a1c"/>

  <!-- Smart Glasses -->
  <rect x="94" y="118" width="28" height="20" rx="6" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
  <rect x="134" y="118" width="28" height="20" rx="6" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
  <path d="M122 125 L134 125" stroke="url(#accent)" stroke-width="2.5"/>
  <path d="M94 124 L84 126" stroke="url(#accent)" stroke-width="2"/>
  <path d="M162 124 L172 126" stroke="url(#accent)" stroke-width="2"/>

  <!-- Glowing AI badge / pin -->
  <circle cx="160" cy="220" r="4" fill="#6366f1"/>
  <circle cx="160" cy="220" r="8" fill="#6366f1" opacity="0.3"/>
</svg>